name: CI and deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install and test backend
        working-directory: Backend
        run: |
          npm ci --no-audit --no-fund --maxsockets=1
          npm test
          npm audit --audit-level=high
        env:
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci --no-audit --no-fund --maxsockets=1
          npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      APP_DIR: /home/ubuntu/app
      WEB_ROOT: /var/www/ai-resume-analyzer
      NGX_SITE: /etc/nginx/sites-available/ai-resume-analyzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/

      - name: Deploy application to EC2
        run: |
          set -euo pipefail
          test -f /home/ubuntu/app-config/backend.env
          sudo mkdir -p "$APP_DIR/Backend" "$WEB_ROOT"
          sudo rsync -a --delete --exclude='.env' --exclude='node_modules/' --exclude='uploads/' Backend/ "$APP_DIR/Backend/"
          sudo rsync -a --delete Frontend/dist/ "$WEB_ROOT/"
          sudo ln -sfn /home/ubuntu/app-config/backend.env "$APP_DIR/Backend/.env"
          sudo npm ci --omit=dev --no-audit --no-fund --maxsockets=1 --prefix "$APP_DIR/Backend"
          sudo chown -R ubuntu:ubuntu "$APP_DIR"
          sudo install -m 0644 deploy/nginx.conf "$NGX_SITE"
          sudo ln -sfn "$NGX_SITE" /etc/nginx/sites-enabled/ai-resume-analyzer
          sudo nginx -t
          sudo systemctl reload nginx
          sudo pm2 delete backend || true
          sudo pm2 start "$APP_DIR/Backend/server.js" --name backend --cwd "$APP_DIR/Backend"
          sudo pm2 save
